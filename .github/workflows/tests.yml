# Название всего процесса, которое будет отображаться во вкладке Actions на GitHub
name: Run tests

# События-триггеры
on:
  push:
    branches: [ main, develop, full_new_bot ]   # Добавил вашу новую ветку
  pull_request:
    branches: [ main ]            # При создании PR в ветку main

jobs:
  # Название работы
  test:
    # На какой ОС запускать тесты
    runs-on: ubuntu-latest

    # Вспомогательные контейнеры
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        # Проверка "здоровья" БД
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Проброс порта из контейнера наружу
          - 5432:5432

    steps:
      # 1. Копируем код репозитория в виртуальную машину
      - uses: actions/checkout@v3

      # 2. Устанавливаем Python нужной версии
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Обновляем pip и устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Проверка качества кода (LINTING)
      - name: Lint and Format with Ruff
        run: |
          # Проверка стиля и ошибок
          ruff check .
          # Проверка форматирования
          ruff format --check .

      # 5. Настраиваем окружение: создаем .env
      - name: Set up environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql+asyncpg://test_user:test_password@localhost:5432/test_db" >> .env

      # 6. Применяем миграции Alembic
      - name: Run migrations
        run: |
          alembic upgrade head

      # 7. Запускаем тесты
      - name: Test with pytest
        run: |
          pytest --cov=api --cov=bot --cov-report=xml --alluredir=allure-results
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          KINOPOISK_API_KEY: ${{ secrets.KINOPOISK_API_KEY }}

      # 8. Скачиваем историю прошлых тестов
      - name: Get Allure history
        uses: actions/checkout@v3
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 9. Генерируем HTML-отчет
      - name: Allure Report action
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      # 10. Публикуем отчет на GitHub Pages (обновлено до v4)
      - name: Deploy Allure report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true